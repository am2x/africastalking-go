version: "2"
run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - ineffassign
    - misspell
    - bodyclose
    - goconst
    - unused
    - gosec
    - gocritic
  settings:
    gosec:
      excludes:
        - G304 # ignore file inclusion via variable.
        - G107 # ignore http request made with variable url.   
  exclusions:
    rules:
      - linters:
          - bodyclose
        path: "_test.go"
formatters:
  enable:
    - gofumpt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0


