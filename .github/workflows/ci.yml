name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The library needs no write access to anything.
permissions:
  contents: read

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with GOLANGCI_VERSION in the Makefile.
  GOLANGCI_VERSION: v2.11.4

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned, not floating: golangci-lint type-checks via x/tools, which
          # cannot read export data from a Go newer than its own release. A
          # floating `stable` silently breaks lint whenever Go ships a release.
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version rather than stopping at the first failure.
      fail-fast: false
      matrix:
        # The floor declared in go.mod, and the current release.
        go: ['1.23.x', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Verify go.mod is tidy
        run: make tidy-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test with the race detector
        run: make cover

      - name: Upload coverage
        if: matrix.go == 'stable'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          # Coverage reporting must never be the reason a PR goes red.
          fail_ci_if_error: false
